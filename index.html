<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NerdSub • Live Subtitles & Tech Intelligence (Nerdearla)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes aura-pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); box-shadow: 0 0 25px rgba(0,245,255,0.4); }
      }
      @keyframes aura-bar {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
    <script>
      window.__auraErrors = [];
      window.addEventListener('error', function(e) {
        window.__auraErrors.push(e.message || String(e));
        console.error('[Aura Boot Error]', e);
        var status = document.getElementById('aura-boot-msg');
        if (status && !window.__reactLoaded) {
          status.innerHTML = '<span style="color:#ef4444;font-weight:bold;">ERROR AL INICIAR: ' + (e.message || 'Error de script') + '</span><br><button onclick="window.location.reload()" style="margin-top:12px;padding:6px 16px;background:#00f5ff;color:#000;border:none;border-radius:6px;font-family:monospace;font-weight:bold;cursor:pointer;">REINTENTAR</button>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('[Aura Unhandled Rejection]', e.reason);
      });
    </script>
  </head>
  <body class="bg-nerd-bg text-nerd-text font-sans antialiased selection:bg-nerd-cyan selection:text-nerd-bg min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #07090e; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(0, 245, 255, 0.12); border: 1px solid rgba(0, 245, 255, 0.4); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 18px; box-shadow: 0 0 20px rgba(0, 245, 255, 0.25); animation: aura-pulse 2s infinite ease-in-out;">⚡</div>
        <div style="font-size: 15px; font-weight: 800; letter-spacing: 0.12em; color: #00f5ff; font-family: monospace; margin-bottom: 8px;">PROJECT AURA // NERDSUB</div>
        <div style="font-size: 12px; color: #94a3b8; font-family: monospace; max-width: 320px; line-height: 1.5;" id="aura-boot-msg">
          INICIALIZANDO CONSOLA DE AUDIENCIA...
        </div>
        <div style="margin-top: 24px; width: 140px; height: 3px; background: #1e293b; border-radius: 2px; overflow: hidden; position: relative;">
          <div style="height: 100%; background: #00f5ff; border-radius: 2px; position: absolute; animation: aura-bar 1.4s infinite ease-in-out;"></div>
        </div>
        <noscript>
          <p style="color: #ef4444; margin-top: 18px; font-size: 12px; font-family: monospace;">Por favor habilite JavaScript en su navegador para ver los subtítulos en vivo.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
